# Training run configuration.
# Loaded and validated by src.schemas.RunConfig (see main.py).

run_name: llm_small_pretrain        # groups experiments; log dir is runs/<run_name>/<exp_name>_<timestamp>
exp_name: train_stp250K_bs16_fix_tokenizer_ds300K         # name of this specific experiment within the run
seed: 42
deterministic: false        # force deterministic CUDA/cuDNN algorithms for reproducible runs
shuffle_train: false       # set false to strictly track loss convergence when adding a new feature

dataset_type: token_ids # ['text', 'token_ids']
# dataset_path: "hf://datasets/IgorVolochay/russian_jokes/dataset.json"
dataset_path: "NotEvilAI_ruwiki_300K_samples"
tokenized_dataset_path: "NotEvilAI_ruwiki_300K_tokenized_msl192.npy"
test_size: 0.01

valid_texts:
  - "Заходит в бар"
  - "Штирлиц пришел домой"

tokenizer:
  cache_dir: "NotEvilAI_ruwiki_300K_tokenized_msl192"
  vocab_size: 1024
  special_tokens: ["[EOS]"]

# Model architecture (was MODEL_CONFIGS["small"] in main.py).
model:
  n_layer: 12
  n_head: 12
  n_kv_head: 6
  hidden_dim: 768
  intermediate_dim: 2048
  dropout: 0.1
  vocab_size: 1024
  max_seq_len: 192
  use_rope: true
  rope_theta: 10000.0
  use_mla: false
  latent_dim: 128

trainer:
  save_checkpoint: true
  pretrained_model_path: null
  pretrained_tokenizer_path: null
  max_seq_len: 192
  batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 0.01
  clip_grad_norm: 1.0
  n_steps: 250000
  val_every_n_steps: 10000
  val_after_train: true

# PyTorch profiler. Traces are written to runs/pytorch_profiler/<run_name>/<exp_name>_<ts>/.
# The schedule is wait -> warmup -> active. To trace the 10th iteration:
# wait=9, warmup=0, active=1 (iterations are 0-indexed internally).
profiler:
  enabled: true
  wait: 8          # skip the first 9 iterations
  warmup: 1        # no warmup
  active: 1        # record 1 iteration (the 10th)
  repeat: 1        # only one wait/warmup/active cycle
  record_shapes: true
  profile_memory: true
  with_stack: false
  # CUDA memory snapshot of a single iteration (viewable at https://pytorch.org/memory_viz)
  memory_snapshot: true
  memory_snapshot_step: 9        # iter_num (0-indexed) to snapshot => the 10th iteration
  memory_snapshot_max_entries: 100000
