# Training run configuration.
# Loaded and validated by src.schemas.RunConfig (see main.py).

run_name: llm_small_sft_vision        # groups experiments; log dir is runs/<run_name>/<exp_name>_<timestamp>
exp_name: sft_gorovuha_stp5K_bs16_from_checkp         # name of this specific experiment within the run
seed: 42
deterministic: true        # force deterministic CUDA/cuDNN algorithms for reproducible runs
shuffle_train: false       # set false to strictly track loss convergence when adding a new feature

dataset_type: vision # ['text', 'token_ids', 'vision']
dataset_path: "gorovuha/ru-image-captions"
tokenized_dataset_path: null
test_size: 0.05

# Column names in the vision dataset.
image_field: "image"
text_field: "capt1"

valid_texts: []

tokenizer:
  cache_dir: "russian_jokes"
  vocab_size: 1024
  special_tokens: ["[EOS]"]


model:
  n_layer: 12
  n_head: 12
  n_kv_head: 6
  hidden_dim: 768
  intermediate_dim: 2048
  dropout: 0.1
  vocab_size: 1024
  max_seq_len: 192
  use_rope: true
  rope_theta: 10000.0
  use_mla: false
  latent_dim: 128
  attn_impl: sdpa          # ['eager', 'sdpa']; sdpa -> FlashAttention-2 kernel (RoPE only)

vision_adapter:
  vision_model_repo_id: "openai/clip-vit-base-patch32"
  input_dim: 768              # CLIP ViT-B/32 hidden size
  output_dim: 768             # must equal model.hidden_dim
  num_image_patches: 49       # (224/32)^2 = 49 patch embeddings (CLS dropped)
  image_start_token: "[IMG_START]"
  image_token: "[IMG]"
  image_end_token: "[IMG_END]"


trainer:
  save_checkpoint: false
  pretrained_model_path: "llm_small_pretrain/train_stp250K_bs16_fix_tokenizer_ds300K/250000.pkl" # null
  pretrained_tokenizer_path: "NotEvilAI_ruwiki_300K_tokenized_msl192" # "russian_jokes"
  max_seq_len: 192
  batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 0.01
  clip_grad_norm: 1.0
  n_steps: 5000
  val_every_n_steps: 100
  val_after_train: true

# PyTorch profiler. Traces are written to runs/pytorch_profiler/<run_name>/<exp_name>_<ts>/.
# The schedule is wait -> warmup -> active (iterations are 0-indexed internally).
# Here we skip the first 10 iterations (0..9) as warmup and record iterations
# 10..20 (iter_num 9..19, i.e. the 10th through 20th steps): 11 active steps.
profiler:
  enabled: true
  wait: 9          # skip the first 9 iterations (0..8) as warmup
  warmup: 0        # no separate warmup phase
  active: 10       
  repeat: 1        # only one wait/warmup/active cycle
  record_shapes: true
  profile_memory: true
  with_stack: false
  # CUDA memory snapshot across the range of iterations (viewable at https://pytorch.org/memory_viz).
  memory_snapshot: false
  memory_snapshot_step: 9
  memory_snapshot_stop_step: 18
  memory_snapshot_max_entries: 1000000
